services:
  firebase-emulator:
    image: node:20-slim
    working_dir: /app
    ports:
      - "4000:4000"   # Emulator UI
      - "8080:8080"   # Firestore
      - "9099:9099"   # Auth
    volumes:
      - firebase-data:/app/data
    environment:
      - GCLOUD_PROJECT=trading-cup-dev
    command: >
      bash -c "
        npm install -g firebase-tools &&
        firebase emulators:start
          --project trading-cup-dev
          --only firestore,auth
          --export-on-exit /app/data
          --import /app/data
      "

volumes:
  firebase-data:
